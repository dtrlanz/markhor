[package]
name = "markhor_cli"
edition = "2024"
default-run = "markhor"
version.workspace = true
license = "MIT OR Apache-2.0"
description = "Command-line interface for Markhor, a project connecting AI models, documents, and workflows for knowledge work"
repository = "https://github.com/dtrlanz/markhor"

[[bin]]
name = "markhor"
path = "src/main.rs"

[dependencies]
markhor.workspace = true
markhor_core.workspace = true
markhor_extensions.workspace = true
anyhow = "1.0.97"
async-trait = "0.1.88"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5.35", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false, features = ["completion", "history", "fuzzy-select"] }
dotenv = "0.15.0"
html2text = "0.17"
indicatif = "0.18"
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
