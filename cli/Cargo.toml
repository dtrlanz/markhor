[package]
name = "markhor_cli"
edition = "2024"
version.workspace = true

[dependencies]
markhor_core = { path = "../core" }
async-trait = "0.1.88"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false, features = ["completion", "history", "fuzzy-select"] }
html2text = "0.17"
indicatif = "0.18"
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["rt", "macros"] }
