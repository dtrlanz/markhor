[package]
name = "markhor"
license = "MIT OR Apache-2.0"
description = "Markhor is a platform connecting AI models, documents, and workflows for knowledge work."
repository = "https://github.com/dtrlanz/markhor"
edition = "2024"
version = "0.1.0-alpha.1.1"

[dependencies]
markhor_core.workspace = true
markhor_extensions.workspace = true
tokio = { version = "1.44.2", features = ["full"] }
dotenv = "0.15.0"
reqwest = { version = "0.12.15", features = ["json", "multipart", "stream"] }
thiserror = "1"

[dev-dependencies]
async-trait = "0.1.88"
mime = "0.3.17"
pulldown-cmark = "0.13.0"
tempfile = "3.19.1"
wiremock = "0.6.5"
